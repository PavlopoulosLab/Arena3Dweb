worker_processes auto;
events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    sendfile on;
    client_max_body_size 20m;   # network TSV / session JSON uploads

    # A reverse proxy on the host connects to this container's published port;
    # Docker NATs that connection through the bridge network's gateway, so
    # $remote_addr is the container's gateway IP (e.g. 172.x.x.1), not
    # 127.0.0.1 or the real visitor, for every request — trust X-Forwarded-For
    # from that bridge range (and loopback, in case of host networking) to
    # recover the real client IP for rate limiting below. Safe here because
    # this container's port is only ever bound to the host's loopback
    # interface (see single-image-deployment.yml), so only the host's own
    # reverse proxy — never an arbitrary external client — can supply it.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;

    # Rate-limit the API: /api/layout and /api/topology run O(V*E) algorithms
    # (betweenness) and are unauthenticated, so a script could saturate CPU.
    # 20 r/s with burst 40 nodelay absorbs an interactive click-burst of a few
    # requests while throttling a sustained flood. Per client IP.
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

    server_tokens off;  # no nginx version in headers and error pages

    server {
        listen 8080;

        # every response: no MIME sniffing, no full URLs to other sites, and
        # no framing by another origin (clickjacking)
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;

        location /api/ {
            limit_req zone=api burst=40 nodelay;
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
        }

        location / {
            root /usr/share/nginx/html;
            try_files $uri /index.html;
            # XSS defense-in-depth: blocks inline/injected scripts even if an
            # escaping fix is missed somewhere else (see the layer/channel-name
            # and node-url XSS fixes in frontend/src/). img-src: Bootstrap's
            # data: SVG icons (select arrows, checkboxes). connect-src: the
            # hand-offs the browser makes itself, only when clicked — STRING's
            # API from the STRING card, Send to NORMA (any https server) and
            # Send to Cytoscape (cyREST on the user's own computer). frame-src:
            # the video tour's player (Home, Help), from YouTube's
            # privacy-enhanced domain, only once it is pressed.
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https: http://localhost:* http://127.0.0.1:*; frame-src https://www.youtube-nocookie.com; object-src 'none'; base-uri 'self'; frame-ancestors 'self';" always;
            # add_header in a location replaces the server's: repeat them
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
        }
    }
}
