[project]
name = "arena3d"
version = "3.0.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "igraph>=0.11.0",
    "pandas>=2.2.0",
    "pydantic>=2.8.0",
    "python-multipart>=0.0.9",
    "leidenalg>=0.12.0",
    "umap-learn>=0.5.12",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "mypy>=1.11.0",
    "ruff>=0.6.0",
    "pandas-stubs>=3.0.3.260530",
    "httpx2>=2.12.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# ruff config lives in backend/; legacy R-side scripts live above it (../www) — never lint those
extend-exclude = ["../www", "../functions", "../views", "../config"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"  # numpy/pandas stubs require 3.12+ type syntax
strict = true

[[tool.mypy.overrides]]
module = ["igraph.*", "leidenalg.*", "scipy.*", "umap.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
